name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS build
    runs-on:
      - self-hosted
      - macOS
      - personal
      - compound-interest
    timeout-minutes: 30
    env:
      XCODE_PATH: /Applications/Xcode.app
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CI_XCODE_DESTINATION: generic/platform=iOS
      CI_XCODE_SDK: iphoneos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_PATH" ]; then
            xcodebuild -version
          else
            echo "Xcode path does not exist: $XCODE_PATH"
            xcode-select -p
            exit 1
          fi

      - name: Install dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list swiftgen >/dev/null 2>&1 || brew install swiftgen
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          bundle install

      - name: Prepare local project env
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'ru.kostyuchenko.compoundInterest' }}
        run: |
          if [ -z "$TEAM_ID" ]; then
            echo "Missing required secret APPLE_TEAM_ID"
            exit 1
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "Missing required variable BUNDLE_ID"
            exit 1
          fi
          cat > Scripts/project.env <<'ENV'
          PROJECT_NAME="Compound Interest"
          APP_DISPLAY_NAME="Сложный процент"
          TARGET_NAME=CompoundInterest
          ENV
          printf 'TEAM_ID=%s\n' "$TEAM_ID" >> Scripts/project.env
          printf 'BUNDLE_ID=%s\n' "$BUNDLE_ID" >> Scripts/project.env

      - name: Run CI
        run: Scripts/ci.sh
